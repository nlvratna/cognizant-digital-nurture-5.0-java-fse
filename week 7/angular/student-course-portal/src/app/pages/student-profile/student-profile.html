<h2>My Profile</h2>
<h3>Enrolled Courses</h3>

<ng-container *ngIf="enrollmentService.getEnrolledCourses() | async as enrolledCourses">
  <ul>
    <li *ngFor="let course of enrolledCourses">
      {{ course.name }} ({{ course.code }}) - {{ course.credits }} Credits
    </li>
  </ul>

  <p *ngIf="enrolledCourses.length === 0">You are not enrolled in any courses yet.</p>
</ng-container>
