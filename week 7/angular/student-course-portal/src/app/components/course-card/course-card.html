<div
  class="card"
  [ngClass]="cardClasses"
  [ngStyle]="{
    'border-left-color':
      course?.gradeStatus === 'passed'
        ? 'green'
        : course?.gradeStatus === 'failed'
          ? 'red'
          : 'grey',
  }"
>
  <h3>{{ course?.name }} ({{ course?.code }})</h3>
  <p>Course ID: {{ course?.id }}</p>
<p>Credits: {{ course?.credits | creditLabel }}</p>

  <div [ngSwitch]="course?.gradeStatus" style="margin-bottom: 10px">
    <span *ngSwitchCase="'passed'" style="color: green; font-weight: bold">Passed</span>
    <span *ngSwitchCase="'failed'" style="color: red; font-weight: bold">Failed</span>
    <span *ngSwitchCase="'pending'" style="color: grey; font-weight: bold">Pending</span>
  </div>

  <button (click)="isExpanded = !isExpanded" style="margin-right: 10px">
    {{ isExpanded ? 'Hide Details' : 'Show Details' }}
  </button>

  <button (click)="toggleEnrollment()">
    {{ enrollmentService.isEnrolled(course?.id) ? 'Unenroll' : 'Enroll' }}
  </button>
</div>
